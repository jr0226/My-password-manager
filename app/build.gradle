plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.mypasswordmanager'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.mypasswordmanager"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // For EncryptedSharedPreferences (covers persistent storage + encryption)
    implementation 'androidx.security:security-crypto:1.1.0'

    // For the login screen (covers the authentication requirement)
    implementation 'androidx.biometric:biometric:1.1.0'

    // To easily convert Java objects to JSON for storage
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.firebase:firebase-firestore:24.10.3'
}